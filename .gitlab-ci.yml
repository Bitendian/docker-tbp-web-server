build-job:
  stage: build
  tags:
    - docker
  image: docker:29.5.3-cli
  # The Docker runner must have privileged = true for Docker-in-Docker.
  services:
    - docker:29.5.3-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
    CONTAINER_NAME: "${CI_REGISTRY_IMAGE}:latest"
  script:
    - docker info
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker build --pull --no-cache -t "$CONTAINER_NAME" .
    - docker push "$CONTAINER_NAME"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: manual
  allow_failure: false
